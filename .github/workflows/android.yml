name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened, synchronize ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: "Build a signed release APK (requires a valid GPLAY_KEYSTORE_PASSWORD secret)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      # Always build and publish the installable debug APK for CI validation.
      # Release signing is deliberately opt-in because it requires the private upload key.
      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen debug md5
        run: md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*

      - name: Validate release signing secret
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        shell: bash
        run: |
          if [ -z "$GPLAY_KEYSTORE_PASSWORD" ]; then
            echo "::error::GPLAY_KEYSTORE_PASSWORD is not configured. Add the correct password for app_pojavlauncher/aamc_upload.jks in repository Actions secrets."
            exit 1
          fi
          keytool -list -keystore app_pojavlauncher/aamc_upload.jks -storepass "$GPLAY_KEYSTORE_PASSWORD" -alias android_github_release >/dev/null

      - name: Build Release .apk
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Gen release md5
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        run: md5sum out/app-release.apk > out/app-release.md5

      - name: Upload release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.*
