name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened, synchronize ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: "Build a signed release APK (requires a valid GPLAY_KEYSTORE_PASSWORD secret)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          python3 seven-gamehub/scripts/test-compatibility-contract.py
          mkdir -p out

      # Always build and publish the installable debug APK for CI validation.
      # Release signing is deliberately opt-in because it requires the private upload key.
      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen debug md5
        run: md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*

      - name: Validate release signing secret
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        shell: bash
        run: |
          if [ -z "$GPLAY_KEYSTORE_PASSWORD" ]; then
            echo "::error::GPLAY_KEYSTORE_PASSWORD is not configured. Add the correct password for app_pojavlauncher/aamc_upload.jks in repository Actions secrets."
            exit 1
          fi
          keytool -list -keystore app_pojavlauncher/aamc_upload.jks -storepass "$GPLAY_KEYSTORE_PASSWORD" -alias android_github_release >/dev/null

      - name: Build Release .apk
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Gen release md5
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        run: md5sum out/app-release.apk > out/app-release.md5

      - name: Upload release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.*
  build-sevenx:
    name: Build SevenX apps
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with Winlator source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Winlator native build tools
        run: sdkmanager "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply SevenX runtime integration
        run: |
          python3 seven-gamehub/scripts/apply-sevenx-winlator-bridge.py seven-gamehub/winlator-source
          python3 seven-gamehub/scripts/apply-sevenx-installer-hardening.py .

      - name: Run SevenX compatibility contract tests
        run: python3 seven-gamehub/scripts/test-compatibility-contract.py

      - name: Build SevenX Game Manager
        working-directory: seven-gamehub
        run: gradle :app:assembleDebug

      - name: Build SevenX Desktop
        working-directory: seven-gamehub/winlator-source
        run: gradle :app:assembleDebug

      - name: Upload SevenX Game Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: sevenx-game-manager-debug
          path: seven-gamehub/app/build/outputs/apk/debug/*.apk

      - name: Upload SevenX Desktop APK
        uses: actions/upload-artifact@v4
        with:
          name: sevenx-desktop-debug
          path: seven-gamehub/winlator-source/app/build/outputs/apk/debug/*.apk

