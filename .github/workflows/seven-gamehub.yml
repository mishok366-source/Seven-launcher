name: SevenX Android

on:
  push:
    branches: [ "seven-gamehub-foundation", "sevenx-0.5.0-runtime", "sevenx-0.6.0-winlator-runtime" ]
    paths:
      - "seven-gamehub/**"
      - ".github/workflows/seven-gamehub.yml"
      - ".gitmodules"
  pull_request:
    paths:
      - "seven-gamehub/**"
      - ".github/workflows/seven-gamehub.yml"
      - ".gitmodules"
  workflow_dispatch:

jobs:
  build-sevenx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build SevenX debug APK
        working-directory: seven-gamehub
        run: gradle :app:assembleDebug
      - name: Upload SevenX APK
        uses: actions/upload-artifact@v4
        with:
          name: sevenx-debug
          path: seven-gamehub/app/build/outputs/apk/debug/app-debug.apk

  build-winlator-reference-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned Winlator source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK and native toolchains
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;24.0.8215888
            cmake;3.22.1
          accept-android-sdk-licenses: true
      - name: Build pinned Winlator reference APK
        working-directory: seven-gamehub/winlator-source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug
      - name: Upload Winlator reference APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-reference-debug
          path: seven-gamehub/winlator-source/app/build/outputs/apk/debug/app-debug.apk
