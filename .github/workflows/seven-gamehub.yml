name: SevenX Android

on:
  push:
    branches: [ "seven-gamehub-foundation", "sevenx-0.5.0-runtime" ]
    paths:
      - "seven-gamehub/**"
      - ".github/workflows/seven-gamehub.yml"
  pull_request:
    paths:
      - "seven-gamehub/**"
      - ".github/workflows/seven-gamehub.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: seven-gamehub
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seven-gamehub-debug
          path: seven-gamehub/app/build/outputs/apk/debug/app-debug.apk
